name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked environment
        run: uv sync --locked

      - name: Audit locked dependencies
        run: |
          uv export --locked --format requirements.txt --no-editable --no-emit-project \
            --output-file /tmp/agentflow-ai-requirements.txt
          uv run pip-audit --strict -r /tmp/agentflow-ai-requirements.txt
