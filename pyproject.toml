[project]
name = "banking-support"
version = "0.1.0"
description = "AI-powered banking customer support — identity verification agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.3.0",
    "langchain-openai>=0.3.0",
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "phonenumbers>=8.13.0",
    "schwifty>=2026.1.0",
    "python-multipart>=0.0.20",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.7.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_support"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "openai.*",
    "phonenumbers.*",
    "schwifty.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "live_llm: tests that call the real LLM provider (run only in PRs with GROQ_API_KEY)",
    "live_speech: tests that call real speech services (run only with speech API credentials)",
]

[tool.coverage.run]
branch = true
source = ["src/banking_support"]

[tool.coverage.report]
fail_under = 80
show_missing = true
