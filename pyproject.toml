[project]
name = "agentflow-ai"
version = "0.1.0"
description = "AgentFlow AI — secure multi-agent customer support platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "langgraph>=1.2.18",
    "langchain-openai>=1.7.3",
    "openai>=3.39.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "phonenumbers>=9.0.42",
    "schwifty>=2026.10.1",
    "python-multipart>=0.0.32",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_support"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "openai.*",
    "phonenumbers.*",
    "schwifty.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "live_llm: tests that call the real LLM provider (run only in PRs with GROQ_API_KEY)",
    "live_speech: tests that call real speech services (run only with speech API credentials)",
]

[tool.coverage.run]
branch = true
source = ["src/healthcare_support"]

[tool.coverage.report]
fail_under = 80
show_missing = true
