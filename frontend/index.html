<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgentFlow AI — an independent secure multi-agent patient support project built with FastAPI, LangGraph, React, and TypeScript."
    />
    <meta name="theme-color" content="#17262b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (window.localStorage.getItem('dark-mode') !== 'false') {
          document.documentElement.classList.add('dark-mode')
        }
      } catch (error) {
        document.documentElement.classList.add('dark-mode')
      }
    </script>
    <title>AgentFlow AI — Secure Multi-Agent Patient Support</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
